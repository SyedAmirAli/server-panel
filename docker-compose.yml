# AppsZone Mail — MySQL + API (serves built SPA).
# Copy .env.example → .env and set DATABASE_URL host to `mysql` for Compose.
# Mailcow runs separately on the VPS (not in this stack).
services:
  mysql:
    image: mysql:8.0
    container_name: appszone-mysql-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    # mysql_native_password keeps Prisma's MySQL driver happy (8.4's SHA-256
    # default triggers "Unknown authentication plugin `sha256_password`").
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: appszone-mail-server
    container_name: appszone-mail-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-4010}:${API_PORT:-4010}"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysqldata:
