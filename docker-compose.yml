services:
    app:
        build:
            context: .
            dockerfile: Dockerfile

        image: appszone-mail-server
        container_name: appszone-mail-server
        restart: unless-stopped

        ports:
            - "4010:4010"

        extra_hosts:
            - "host.docker.internal:host-gateway"

        environment:
            # Postgres runs natively on the host; the container reaches it through
            # the host-gateway alias declared in extra_hosts above.
            PG_HOST: host.docker.internal
            PG_PORT: 5432
            PG_DATABASE: apz_mailserver
            PG_USER: appszone
            PG_PASSWORD: utJZOjarOFTsDuMs2Vo0SvpSasbU
            DATABASE_URL: "postgresql://appszone:utJZOjarOFTsDuMs2Vo0SvpSasbU@host.docker.internal:5432/apz_mailserver?schema=public"
